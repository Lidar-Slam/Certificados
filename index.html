<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificar Certificado | LIDAR SLAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 30px 0; background: linear-gradient(135deg, #1a3a6c, #2c5282); color: white; border-radius: 12px; margin-bottom: 30px; }
    .header img { height: 90px; margin-bottom: 15px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; }
    .content { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .subtitle { text-align: center; color: #555; margin-bottom: 25px; font-size: 1.1rem; }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
    #dni { flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
    #dni:focus { outline: none; border-color: #2c5282; }
    button { background: #2c5282; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 500; cursor: pointer; }
    button:hover { background: #1a3a6c; }
    #resultado { margin-top: 25px; }
    .result { background: #f0f9ff; border-left: 4px solid #3182ce; padding: 15px; border-radius: 0 8px 8px 0; }
    .error { background: #fff5f5; border-left: 4px solid #e53e3e; padding: 15px; border-radius: 0 8px 8px 0; }
    .result-item { background: white; padding: 15px; margin: 15px 0; border-radius: 8px; border: 1px solid #eee; }
    .result-item h4 { color: #2c5282; margin-bottom: 10px; }
    .result-item p { margin: 5px 0; color: #444; }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn-ver { background: #3182ce; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 500; }
    .btn-descargar { background: #38a169; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 500; }
    .hash-code { background: #edf2f7; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-size: 0.85rem; }
    @media (max-width: 600px) { .form-group { flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/Logo_Lidar_Slam.jpg" alt="LIDAR SLAM Logo" onerror="this.style.display='none'">
      <h1>Verificar Certificado LIDAR SLAM</h1>
    </div>
    <div class="content">
      <p class="subtitle">Ingrese su DNI para verificar la autenticidad de su certificado.</p>
      <form id="formVerificar">
        <div class="form-group">
          <input type="text" id="dni" name="dni" placeholder="Ingrese su DNI (ej: 76543210)" required maxlength="8" pattern="\d{8}" />
          <button type="submit">🔍 Buscar</button>
        </div>
      </form>
      <div id="resultado"></div>
    </div>
    <footer style="text-align: center; margin-top: 30px; color: #777; font-size: 0.9rem;">
      <p>© 2026 LIDAR SLAM - Sistema de Verificación de Certificados</p>
    </footer>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9R-v6yKLQOLMLEZL2B8EZ2Q0JsQV13Ltoj1Z7R7rVUOWKoDbvUL86YVWycx_NE9LPNA/exec';
    
    document.getElementById('formVerificar').addEventListener('submit', (e) => {
      e.preventDefault();
      const dni = document.getElementById('dni').value.trim();
      const resultado = document.getElementById('resultado');
      resultado.innerHTML = '<p style="text-align:center; color:#555;">🔄 Buscando...</p>';
      
      const oldScript = document.getElementById('data-script');
      if (oldScript) oldScript.remove();
      
      window.handleResponse = (data) => {
        const certificados = data.filter(c => 
          String(c.DNI).trim() === String(dni).trim() && 
          String(c.Estado).trim().toLowerCase() === 'activo'
        );
        
        if (certificados.length === 0) {
          resultado.innerHTML = `<div class="error"><h3>❌ No encontrado</h3><p>No se encontró certificado activo con DNI <strong>${dni}</strong>.</p></div>`;
          return;
        }
        
        const itemsHTML = certificados.map((cert, index) => {
          let fechaFmt = cert.Fecha;
          if (fechaFmt instanceof Date) fechaFmt = fechaFmt.toLocaleDateString('es-PE');
          else if (typeof fechaFmt === 'string' && fechaFmt.includes('T')) fechaFmt = fechaFmt.split('T')[0];
          
          const hash = (cert.QR_Code_Hash && String(cert.QR_Code_Hash).trim()) ? String(cert.QR_Code_Hash).trim() : String(cert.ID_Certificado || '').trim();
          const verificarURL = `verificar.html?hash=${encodeURIComponent(hash)}`;
          const pdfURL = cert.PDF ? `certificados/${cert.PDF}` : '#';
          
          return `
          <div class="result-item">
            <h4>📄 Certificado #${index + 1}</h4>
            <p><strong>ID:</strong> ${cert.ID_Certificado || '—'}</p>
            <p><strong>Nombre:</strong> ${cert.Nombre_Completo || '—'}</p>
            <p><strong>Evento:</strong> ${cert.Evento || '—'}</p>
            <p><strong>Fecha:</strong> ${fechaFmt || '—'}</p>
            <p><strong>Estado:</strong> <span style="color:${cert.Estado==='Activo'?'#38a169':'#e53e3e'}">${cert.Estado || '—'}</span></p>
            <div class="btn-group">
              <a href="${verificarURL}" target="_blank" class="btn-ver">👁️ Ver Certificado</a>
              ${cert.PDF ? `<a href="${pdfURL}" target="_blank" class="btn-descargar">⬇️ Descargar PDF</a>` : ''}
            </div>
            <p style="margin-top:10px; font-size:0.85rem; color:#777;"><strong>Hash:</strong> <span class="hash-code">${hash}</span></p>
          </div>`;
        }).join('');
        
        resultado.innerHTML = `<div class="result"><h3>✅ Se encontraron ${certificados.length} certificado${certificados.length > 1 ? 's' : ''}</h3>${itemsHTML}</div>`;
      };
      
      const script = document.createElement('script');
      script.id = 'data-script';
      script.src = `${APPS_SCRIPT_URL}?callback=handleResponse`;
      document.head.appendChild(script);
    });
    
    document.getElementById('dni').addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '').slice(0, 8);
    });
  </script>
</body>
</html>
