<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Verifica certificados LIDAR SLAM">
  <title>Verificar Certificado | LIDAR SLAM</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Roboto',sans-serif;background:#f5f7fa;color:#333;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:20px}.header{text-align:center;padding:30px 0;background:linear-gradient(135deg,#1a3a6c,#2c5282);color:#fff;border-radius:12px;margin-bottom:30px}.header img{height:90px;margin-bottom:15px}.header h1{font-size:1.8rem;font-weight:700}.content{background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.subtitle{text-align:center;color:#555;margin-bottom:25px;font-size:1.1rem}.form-group{display:flex;gap:10px;flex-wrap:wrap}#dni{flex:1;min-width:200px;padding:12px 15px;border:2px solid #ddd;border-radius:8px;font-size:1rem}#dni:focus{outline:none;border-color:#2c5282}button{background:#2c5282;color:#fff;border:none;padding:12px 25px;border-radius:8px;font-weight:500;cursor:pointer;transition:background .3s}button:hover{background:#1a3a6c}#resultado{margin-top:25px}.result{background:#f0f9ff;border-left:4px solid #3182ce;padding:15px;border-radius:0 8px 8px 0}.error{background:#fff5f5;border-left:4px solid #e53e3e;padding:15px;border-radius:0 8px 8px 0}.result-item{background:#fff;padding:15px;margin:15px 0;border-radius:8px;border:1px solid #eee}.result-item h4{color:#2c5282;margin-bottom:10px}.result-item p{margin:5px 0;color:#444}.btn-group{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn-ver{background:#3182ce;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:500;display:inline-block}.btn-descargar{background:#38a169;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none;font-weight:500;display:inline-block}.hash-code{background:#edf2f7;padding:3px 8px;border-radius:4px;font-family:monospace;font-size:.85rem}@media(max-width:600px){.form-group{flex-direction:column}button{width:100%}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="assets/Logo_Lidar_Slam.jpg" alt="LIDAR SLAM" onerror="this.style.display='none'">
      <h1>Verificar Certificado LIDAR SLAM</h1>
    </div>
    <div class="content">
      <p class="subtitle">Ingrese su DNI para verificar su certificado.</p>
      <form id="formVerificar">
        <div class="form-group">
          <input type="text" id="dni" placeholder="DNI (8 dígitos)" required maxlength="8" pattern="\d{8}" inputmode="numeric">
          <button type="submit" id="btnBuscar">🔍 Buscar</button>
        </div>
      </form>
      <div id="resultado"></div>
    </div>
    <footer style="text-align:center;margin-top:30px;color:#777;font-size:.9rem">
      <p>© 2026 LIDAR SLAM</p>
    </footer>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TU URL DE SHEETDB
    const API_URL = 'https://sheetdb.io/api/v1/bu9mzx9wsqbt6';
    
    // ✅ Caché en memoria para consultas repetidas
    const cache = new Map();
    
    document.getElementById('formVerificar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dni = document.getElementById('dni').value.trim();
      const resultado = document.getElementById('resultado');
      const btn = document.getElementById('btnBuscar');
      
      // ✅ UI feedback inmediato
      resultado.innerHTML = '<p style="text-align:center;color:#555">🔄 Buscando...</p>';
      btn.disabled = true;
      btn.textContent = '⏳ Buscando...';
      
      try {
        // ✅ Usar caché si ya se consultó
        if (cache.has(dni)) {
          mostrarResultados(cache.get(dni), dni);
          btn.disabled = false;
          btn.textContent = '🔍 Buscar';
          return;
        }
        
        // ✅ Fetch optimizado con timeout
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        
        // ✅ SheetDB: filtrar por DNI y Estado=Activo en la URL
        const response = await fetch(`${API_URL}/search/DNI/${dni}?Estado=Activo`, {
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        clearTimeout(timeout);
        
        if (!response.ok) throw new Error('HTTP ' + response.status);
        
        const data = await response.json();
        const certificados = Array.isArray(data) ? data : [data].filter(d => d && d.DNI);
        
        // ✅ Guardar en caché
        cache.set(dni, certificados);
        mostrarResultados(certificados, dni);
        
      } catch (err) {
        console.error('❌ Error:', err);
        resultado.innerHTML = `<div class="error"><h3>⚠️ Error</h3><p>${err.message.includes('abort') ? 'Tiempo de espera agotado' : 'No se pudo conectar'}. Intenta de nuevo.</p></div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Buscar';
      }
    });
    
    // ✅ Función optimizada para renderizar resultados
    function mostrarResultados(certificados, dni) {
      const resultado = document.getElementById('resultado');
      
      // Filtrar activos (doble verificación por si SheetDB no filtra bien)
      const activos = certificados.filter(c => 
        c && String(c.DNI).trim() === dni && String(c.Estado).trim().toLowerCase() === 'activo'
      );
      
      if (activos.length === 0) {
        resultado.innerHTML = `<div class="error"><h3>❌ No encontrado</h3><p>No hay certificado activo con DNI <strong>${dni}</strong>.</p></div>`;
        return;
      }
      
      // ✅ Usar DocumentFragment para renderizado rápido
      const fragment = document.createDocumentFragment();
      const container = document.createElement('div');
      container.className = 'result';
      container.innerHTML = `<h3>✅ ${activos.length} certificado${activos.length>1?'s':''} encontrado${activos.length>1?'s':''}</h3>`;
      
      activos.forEach((cert, index) => {
        // Formatear fecha
        const fecha = cert.Fecha ? (cert.Fecha instanceof Date ? cert.Fecha.toLocaleDateString('es-PE') : String(cert.Fecha).split('T')[0]) : '—';
        
        // ✅ Hash para URL: priorizar QR_Code_Hash, fallback a ID_Certificado
        const hash = (cert.QR_Code_Hash && String(cert.QR_Code_Hash).trim()) 
          ? String(cert.QR_Code_Hash).trim() 
          : String(cert.ID_Certificado || '').trim();
        
        // ✅ URL directa con hash (1 click a verificación)
        const verificarURL = `verificar.html?hash=${encodeURIComponent(hash)}`;
        const pdfURL = cert.PDF ? `certificados/${cert.PDF}` : '#';
        
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <h4>📄 Certificado #${index+1}</h4>
          <p><strong>ID:</strong> ${cert.ID_Certificado||'—'}</p>
          <p><strong>Nombre:</strong> ${cert.Nombre_Completo||'—'}</p>
          <p><strong>Evento:</strong> ${cert.Evento||'—'}</p>
          <p><strong>Fecha:</strong> ${fecha}</p>
          <p><strong>Modalidad:</strong> ${cert.Modalidad||'—'}</p>
          <p><strong>Estado:</strong> <span style="color:${cert.Estado==='Activo'?'#38a169':'#e53e3e'};font-weight:500">${cert.Estado||'—'}</span></p>
          <div class="btn-group">
            <a href="${verificarURL}" class="btn-ver" target="_blank">👁️ Ver Certificado</a>
            ${cert.PDF ? `<a href="${pdfURL}" class="btn-descargar" target="_blank">⬇️ Descargar PDF</a>` : ''}
          </div>
          ${hash ? `<p style="margin-top:10px;font-size:.85rem;color:#777"><strong>Hash:</strong> <span class="hash-code">${hash}</span></p>` : ''}
        `;
        container.appendChild(item);
      });
      
      fragment.appendChild(container);
      resultado.innerHTML = '';
      resultado.appendChild(fragment);
    }
    
    // ✅ Validación en tiempo real: solo números, máximo 8 dígitos
    document.getElementById('dni').addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '').slice(0, 8);
    });
  </script>
</body>
</html>
